# ===================================================================
# VentureVital Backend — Application Configuration
# ===================================================================

# Server
server.port=8081

# H2 Database
spring.datasource.url=jdbc:h2:mem:venturevital;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=VentureVital2026SecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!
jwt.expiration=86400000

# Logging
logging.level.com.venturevital=DEBUG
logging.level.org.springframework.security=DEBUG
